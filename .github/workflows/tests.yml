name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # The job id "test" is the name that appears in the
  # "Require status checks to pass" list in the branch protection rule.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      # Tests run against an in-memory SQLite database (TestingConfig),
      # so no MySQL service is needed on the runner.
      - name: Run unit and integration tests
        run: python -m pytest -v
